# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: multipliquest-api
    runtime: python
    plan: free
    autoDeployTrigger: off
    buildCommand: uv sync --frozen && uv run python manage.py collectstatic --noinput
    preDeployCommand: uv run python manage.py migrate --noinput
    startCommand: uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: multipliquest-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: multipliquest-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: multipliquest-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: LOGIN_RATE_LIMIT_ATTEMPTS
        value: "5"
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: "300"
      - key: DATABASE_URL
        fromDatabase:
          name: multipliquest-db
          property: connectionString

  - type: web
    name: multipliquest-frontend
    runtime: static
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: multipliquest-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: multipliquest-db
    plan: free
